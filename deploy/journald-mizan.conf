# Installed manually (see deploy/README.md, "Log rotation") as
# /etc/systemd/journald.conf.d/mizan.conf - a drop-in override, not an edit
# to journald's own shipped journald.conf, so this survives an OS upgrade
# cleanly and can be removed independently by deleting one file.
#
# Stage 14: journald had been accumulating indefinitely (noticed during the
# .vscode-server disk-full incident, though that incident's actual cause was
# unrelated - see the roadmap doc). SystemMaxUse bounds journald's own
# on-disk footprint permanently instead of relying on someone remembering to
# run `journalctl --vacuum-time=...` by hand. This is a system-wide setting,
# not specific to mizan-daemon - journald has no true per-unit persistent
# size cap - but 200M is generous relative to observed usage and nowhere
# close to filling a small VPS disk even left unattended indefinitely.
[Journal]
SystemMaxUse=200M
